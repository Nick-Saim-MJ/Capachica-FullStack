name: aplicativo_capachica
description: "aplicativo_capachica"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: # Asegúrate de tener esta línea
    sdk: flutter
  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  # State Management
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  equatable: ^2.0.5

  # Network / HTTP
  dio: ^5.3.2
  qr_flutter: ^4.1.0
  retrofit: ^4.0.3
  http: ^1.2.2  # versión compatible con ambas ramas

  # Device / Plugins
  image_picker: ^1.0.4
  url_launcher: ^6.3.1
  geolocator: ^10.1.0
  permission_handler: ^11.0.1
  share_plus: ^7.2.1
  connectivity_plus: ^5.0.2
  mapbox_maps_flutter: ^2.10.0
  intl: ^0.20.2
  flutter_map: ^6.1.0
  font_awesome_flutter: ^10.7.0

  # Storage & Auth
  flutter_secure_storage: ^8.0.0
  shared_preferences: ^2.2.2
  get_storage: ^2.1.1

  # Dependency Injection & FP
  get_it: ^8.2.0  # versión más reciente
  dartz: ^0.10.1

  # JSON / Annotations
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  retrofit_generator: ^7.0.8
  freezed: ^2.4.6
  mockito: ^5.4.4
  bloc_test: ^9.1.5

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/emprendedores/
